services:
  backend:
    image: mrx505/attendance-backend:latest
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=[REDACTED:secret-value]
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRATION_MINUTES=30
      - DATABASE_URL=postgresql://user:pass@db:5432/db

    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=db
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
